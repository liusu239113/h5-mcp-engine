<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hexora</title>
<link rel="stylesheet" href="theme-dark.css">
<link rel="stylesheet" href="cindy-tokens.css">
<style>
/* ---- 全部颜色/圆角都来自 Cindy 的真实主题变量 ----
   theme-dark.css 是从 Cindy 的 cindy-dark.ts（生成区块）机器提取的，值未经改动；
   cindy-tokens.css 是它 styles/generated/tokens.css 的原文。
   这里只做「别名 → Cindy token」映射，本文件里不再写死任何色值。 */
:root{
  --bg: var(--surface, #181818);
  --card: var(--surface-elevated, #1f1f1f);
  --chip: var(--surface-chip, #1d1d1d);
  --border: var(--border-default, #313131);
  --text: var(--text-primary, #d4d4d4);
  --text2: var(--text-secondary, #6f6f6f);
  --text3: var(--text-tertiary, #c1c1c1);
  --cta: var(--accent-cta-bg, #eeeeee);
  --cta-fg: var(--accent-pure-cta-fg, #151515);
  --blue: #417cdd;
  --red: var(--error-flat, #df0c27);
  --radius: var(--radius-xl, 12px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.62 -apple-system,"Noto Sans SC",system-ui,sans-serif;
  overscroll-behavior:none}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 顶栏 ---------- */
#hd{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
  padding-top:calc(10px + env(safe-area-inset-top))}
#title{flex:1;min-width:0;font-weight:600;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 10px;
  border:1px solid var(--border);border-radius:999px;background:var(--chip);
  color:var(--text3);font-size:12px;white-space:nowrap;max-width:46vw;
  overflow:hidden;text-overflow:ellipsis}
.chip:active{background:var(--card)}
.ico{width:32px;height:32px;flex:0 0 auto;border:1px solid var(--border);
  border-radius:9px;background:var(--chip);color:var(--text3);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.ico:active{background:var(--card)}

/* ---------- 消息流 ---------- */
#stream{flex:1 1 auto;overflow-y:auto;padding:14px 12px 6px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.row{margin-bottom:14px;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row.user{display:flex;justify-content:flex-end}
.row.user .body{max-width:82%;background:var(--cta);color:var(--cta-fg);
  border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap;
  word-break:break-word;font-weight:500}
.row.ai .body{white-space:pre-wrap;word-break:break-word;color:var(--text)}
.row.ai .body p{margin:0 0 8px}
.row.ai .body p:last-child{margin-bottom:0}
.row.sys{color:var(--text2);font-size:12.5px;text-align:center}

/* 思考块 */
.think{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--chip);margin:0 0 10px;overflow:hidden}
.think summary{list-style:none;padding:8px 11px;color:var(--text2);
  font-size:12.5px;display:flex;align-items:center;gap:6px}
.think summary::-webkit-details-marker{display:none}
.think summary .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.think[open] summary{border-bottom:1px solid var(--border)}
.think .txt{padding:10px 12px;color:var(--text2);font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}

/* 工具行 */
.tools{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--chip);margin:0 0 10px;overflow:hidden}
.tools>.th{padding:8px 11px;color:var(--text2);font-size:12.5px;
  display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.tool{padding:8px 11px;border-top:1px solid var(--border);font-size:12.5px;
  display:flex;gap:8px;align-items:flex-start}
.tool:first-child{border-top:0}
.tool .st{flex:0 0 auto;width:14px;text-align:center;color:var(--text2)}
.tool.run .st{color:var(--blue)}
.tool.ok .st{color:#5fbf7a}
.tool.fail .st{color:var(--red)}
.tool .nm{color:var(--text3);font-family:ui-monospace,Menlo,monospace;
  font-size:12px;flex:0 0 auto;max-width:44%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tool .tg{flex:1;min-width:0;color:var(--text2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tool.open .tg{white-space:pre-wrap;word-break:break-all}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 图片 / 素材 */
.shots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.shots img{width:104px;height:104px;object-fit:cover;border-radius:10px;
  border:1px solid var(--border);background:var(--chip)}
.card{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);padding:10px 12px;margin:0 0 10px;
  display:flex;align-items:center;gap:10px;font-size:13px}
.card .k{color:var(--text3);font-size:12px}
.card .v{color:var(--text);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.err{border-color:#5a2530;background:#241a1c;color:#f0a6ae;
  border-radius:var(--radius);padding:10px 12px;margin:0 0 10px;font-size:13px}

/* 运行汇总 */
.sum{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--chip);margin:0 0 10px}
.sum>.sh{padding:8px 11px;color:var(--text2);font-size:12.5px;
  display:flex;gap:6px;align-items:center}
.sum details{border-top:1px solid var(--border)}
.sum details>summary{list-style:none;padding:7px 11px;color:var(--text2);font-size:12px}
.sum details>summary::-webkit-details-marker{display:none}
.sum .sd{padding:0 12px 10px;color:var(--text3);font-size:12.5px;white-space:pre-wrap}

/* ---------- 输入区 ---------- */
#ft{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#cbar{display:flex;align-items:center;gap:8px;margin-bottom:7px;
  font-size:12px;color:var(--text2);min-height:16px}
#cbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border);
  border-radius:14px;background:var(--card);padding:7px 7px 7px 12px}
#inp{flex:1;min-height:24px;max-height:132px;resize:none;border:0;outline:0;
  background:none;color:var(--text);font:inherit;line-height:1.5;
  padding:4px 0;overflow-y:auto}
#inp::placeholder{color:var(--text2)}
#send{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--cta);
  color:var(--cta-fg);font-size:16px;display:flex;align-items:center;
  justify-content:center;font-weight:700}
#send.stop{background:var(--red);color:#fff}
#send[disabled]{opacity:.35}
#jump{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--text3);display:none;
  align-items:center;justify-content:center;font-size:15px;z-index:6}

/* ---------- 抽屉 ---------- */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#mask.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;
  background:var(--bg);border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;transform:translateY(102%);
  transition:transform .22s ease;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet .sh2{display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--border)}
#sheet .sh2 b{flex:1;font-size:14px}
#sheet .bd{overflow-y:auto;padding:6px 14px calc(18px + env(safe-area-inset-bottom))}
.sec{margin:14px 0 6px;color:var(--text2);font-size:12px;letter-spacing:.04em}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:1px solid var(--border);border-radius:10px;background:var(--chip);
  margin-bottom:8px;font-size:13.5px}
.opt:active{background:var(--card)}
.opt .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .d{color:var(--text2);font-size:12px;flex:0 0 auto}
.opt.sel{border-color:var(--blue)}
.opt.sel .t{color:#fff}
input.f,inp.f{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;
  background:var(--chip);color:var(--text);padding:0 12px;font:inherit;outline:0}
.btn{width:100%;height:44px;border-radius:11px;background:var(--cta);
  color:var(--cta-fg);font-weight:600;margin-top:10px}
.btn.ghost{background:var(--chip);color:var(--text3);border:1px solid var(--border)}
.lbl{color:var(--text2);font-size:12px;margin:10px 0 5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .sg{padding:7px 12px;border:1px solid var(--border);border-radius:999px;
  background:var(--chip);color:var(--text3);font-size:12.5px}
.seg .sg.sel{background:var(--cta);color:var(--cta-fg);border-color:var(--cta)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:10px;font-size:13px;z-index:30;opacity:0;
  transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<div id="hd">
  <span class="chip" id="mchip" onclick="UI.settings()">未配置模型</span>
  <div id="title">新对话</div>
  <button class="ico" onclick="UI.newChat()" title="新对话">＋</button>
  <button class="ico" onclick="UI.settings()" title="设置">⚙</button>
</div>

<div id="stream"></div>
<button id="jump" onclick="UI.jump()">↓</button>

<div id="ft">
  <div id="cbar"><span class="grow" id="stat"></span><span id="stepi"></span></div>
  <div class="box">
    <textarea id="inp" rows="1" placeholder="说点什么…（回车发送）"></textarea>
    <button id="send" onclick="UI.tapSend()">↑</button>
  </div>
</div>

<div id="mask" onclick="UI.closeSheet()"></div>
<div id="sheet">
  <div class="sh2"><b id="shTitle">设置</b>
    <button class="ico" onclick="UI.closeSheet()">✕</button></div>
  <div class="bd" id="shBody"></div>
</div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
