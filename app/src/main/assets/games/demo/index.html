<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>接方块 · Demo</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0e1116; color: #e6e9ef; overflow: hidden;
    font-family: -apple-system, "Noto Sans SC", sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 16px; right: 16px;
    display: flex; justify-content: space-between; font-size: 15px; pointer-events: none;
    text-shadow: 0 1px 4px #000; letter-spacing: .5px;
  }
  #hud b { font-size: 19px; color: #4ade80; }
  #tip {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px);
    text-align: center; font-size: 12px; color: #6b7a8d; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div>得分 <b id="score">0</b></div>
  <div>最高 <b id="best">0</b></div>
</div>
<div id="tip">手指按住屏幕拖动，接住绿色方块</div>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
