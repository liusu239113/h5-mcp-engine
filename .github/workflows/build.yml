name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
# 同分支连续推送时，取消上一次还在跑的构建：省额度、也不用等队列里那个过期的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "runner 预装 platforms:"
          ls /usr/local/lib/android/sdk/platforms || true
          SDKMGR=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Fetch H5 frameworks into assets/lib
        continue-on-error: true
        run: |
          set +e
          mkdir -p app/src/main/assets/lib
          fetch () {
            local name="$1"; shift
            for u in "$@"; do
              if curl -fsSL --retry 2 --retry-delay 2 --max-time 90 "$u" -o "app/src/main/assets/lib/$name"; then
                echo "OK   $name <- $u ($(wc -c < "app/src/main/assets/lib/$name") bytes)"
                return 0
              fi
            done
            rm -f "app/src/main/assets/lib/$name"
            echo "SKIP $name (所有镜像都失败，运行时会自动退回 CDN)"
            return 0
          }
          fetch phaser.min.js  https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js       https://unpkg.com/phaser@3.80.1/dist/phaser.min.js
          fetch pixi.min.js    https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js         https://unpkg.com/pixi.js@7.4.2/dist/pixi.min.js
          fetch three.min.js   https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js       https://unpkg.com/three@0.137.0/build/three.min.js
          fetch matter.min.js  https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js   https://unpkg.com/matter-js@0.19.0/build/matter.min.js
          fetch p5.min.js      https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js                https://unpkg.com/p5@1.9.0/lib/p5.min.js
          fetch howler.min.js  https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js        https://unpkg.com/howler@2.2.4/dist/howler.min.js
          echo "--- assets/lib 内容 ---"
          ls -la app/src/main/assets/lib

      - name: Build release APK (正签)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        continue-on-error: true
        run: |
          set +e
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          "${BT}/apksigner" verify --print-certs "$APK" | head -8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hexora-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 自动发 Release：以前每次都要手工建 tag / 传 APK，导致「GitHub 上没有可下载的
      # 测试链接」。artifact 虽然也在，但下载要登录 GitHub，手机上点不开 ——
      # Release 的资产是公开直链，扫一下就能下。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          TAG="v$VER"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "版本 $VER (vc$CODE) → tag $TAG，APK=$APK"
          # 同名 tag / release 已存在时直接覆盖资产，不报错（重跑同版本很常见）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Hexora $TAG" \
              --notes "自动构建 · 提交 ${GITHUB_SHA:0:7}" \
              --latest
          fi
          echo "下载直链：https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$APK")"